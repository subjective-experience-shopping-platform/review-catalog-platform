name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: Deploy to a separately configured AWS environment
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: review-catalog-platform-production
  cancel-in-progress: false

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        shell: bash
        run: |
          gitleaks_version="8.30.0"
          archive="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          expected_sha256="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/${archive}" \
            --output "${archive}"
          printf '%s  %s\n' "${expected_sha256}" "${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" gitleaks
          ./gitleaks git --redact=100

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Validate backend
        working-directory: backend
        run: |
          uv sync --frozen --extra reclustering --dev
          uv run ruff check src tests
          uv run pytest -q

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate deployment contracts
        run: |
          docker compose config --quiet
          bash -n deploy/aws/activate-release.sh deploy/aws/user-data.sh scripts/codedeploy/*.sh
          grep -F -- '--no-deps --force-recreate frontend' deploy/aws/activate-release.sh

  deploy:
    name: Deploy production with CodeDeploy
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_aws && vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      HTTPS_ORIGIN: ${{ vars.HTTPS_ORIGIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate explicit deployment configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_ROLE_ARN ARTIFACT_BUCKET CODEDEPLOY_APPLICATION CODEDEPLOY_DEPLOYMENT_GROUP CLOUDFRONT_DISTRIBUTION_ID HTTPS_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure repository variable ${name} before enabling AWS deployment."
              exit 1
            fi
          done
          [[ "${HTTPS_ORIGIN}" == https://* ]]

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-review-catalog-${{ github.run_id }}

      - name: Create immutable CodeDeploy bundle
        run: |
          printf '%s\n' "${GITHUB_SHA}" > REVISION
          git archive --format=zip --output bundle.zip HEAD
          zip -q bundle.zip REVISION
          sha256sum bundle.zip > SHA256SUMS

      - name: Upload private deployment artifact
        run: |
          prefix="ci/${GITHUB_SHA}"
          aws s3 cp bundle.zip "s3://${ARTIFACT_BUCKET}/${prefix}/bundle.zip" --checksum-algorithm SHA256 --only-show-errors
          aws s3 cp SHA256SUMS "s3://${ARTIFACT_BUCKET}/${prefix}/SHA256SUMS" --only-show-errors

      - name: Create CodeDeploy deployment
        id: codedeploy
        run: |
          deployment_id="$(aws deploy create-deployment \
            --application-name "${CODEDEPLOY_APPLICATION}" \
            --deployment-group-name "${CODEDEPLOY_DEPLOYMENT_GROUP}" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --description "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --s3-location "bucket=${ARTIFACT_BUCKET},key=ci/${GITHUB_SHA}/bundle.zip,bundleType=zip" \
            --file-exists-behavior OVERWRITE \
            --query deploymentId --output text)"
          printf 'deployment_id=%s\n' "${deployment_id}" >> "${GITHUB_OUTPUT}"
          aws deploy wait deployment-successful --deployment-id "${deployment_id}"
          aws deploy get-deployment --deployment-id "${deployment_id}" \
            --query 'deploymentInfo.{deploymentId:deploymentId,status:status,revision:description}'

      - name: Invalidate CloudFront cache
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*' \
            --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      - name: Verify HTTPS deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
            "${HTTPS_ORIGIN}/api/health" | jq .
          index_html="$(curl --fail --silent --show-error "${HTTPS_ORIGIN}/")"
          asset_path="$(printf '%s' "${index_html}" | grep -o 'src="/assets/[^"]*\.js"' | head -1 | cut -d '"' -f2)"
          test -n "${asset_path}"
          curl --fail --silent --show-error "${HTTPS_ORIGIN}${asset_path}" >/dev/null
